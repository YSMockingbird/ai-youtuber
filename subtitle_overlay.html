<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI YouTuber Subtitle Overlay</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      .subtitle {
        position: absolute;
        left: 50%;
        bottom: 7%;
        width: min(88%, 1200px);
        transform: translateX(-50%);
        padding: 16px 22px;
        border: 2px solid rgba(255, 255, 255, 0.82);
        border-radius: 8px;
        background: rgba(8, 12, 20, 0.78);
        color: #ffffff;
        font-size: clamp(28px, 3.2vh, 48px);
        font-weight: 700;
        line-height: 1.5;
        text-align: center;
        text-shadow:
          0 2px 2px rgba(0, 0, 0, 0.95),
          0 0 8px rgba(0, 0, 0, 0.9);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .subtitle[data-emotion="happy"] {
        border-color: #ffd166;
      }

      .subtitle[data-emotion="angry"] {
        border-color: #ff6b6b;
      }

      .subtitle[data-emotion="sad"] {
        border-color: #78b7ff;
      }

      .subtitle[data-emotion="surprised"] {
        border-color: #88e0d0;
      }
    </style>
  </head>
  <body>
    <div id="subtitle" class="subtitle" role="status" aria-live="polite" hidden></div>
    <script>
      const subtitle = document.getElementById('subtitle');
      const events = new EventSource('/subtitle-events');

      events.onmessage = (event) => {
        try {
          const command = JSON.parse(event.data);
          if (command.type === 'clear') {
            subtitle.textContent = '';
            subtitle.hidden = true;
            delete subtitle.dataset.emotion;
            return;
          }
          if (command.type !== 'subtitle' || typeof command.text !== 'string') {
            throw new Error('未対応の字幕コマンドです。');
          }
          subtitle.textContent = command.text;
          subtitle.dataset.emotion = command.emotion || 'neutral';
          subtitle.hidden = false;
        } catch (error) {
          console.error('字幕コマンドを処理できませんでした:', error);
        }
      };

      events.onerror = () => {
        console.error('字幕サーバーとの接続が切れました。再接続を待機します。');
      };
    </script>
  </body>
</html>
