<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI YouTuber Subtitle Overlay</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      .subtitle {
        position: absolute;
        left: 50%;
        bottom: 7%;
        width: min(88%, 1200px);
        transform: translateX(-50%);
        padding: 16px 22px;
        border: 2px solid rgba(255, 255, 255, 0.82);
        border-radius: 8px;
        background: rgba(8, 12, 20, 0.78);
        color: #ffffff;
        font-size: clamp(28px, 3.2vh, 48px);
        font-weight: 700;
        line-height: 1.5;
        text-align: center;
        text-shadow:
          0 2px 2px rgba(0, 0, 0, 0.95),
          0 0 8px rgba(0, 0, 0, 0.9);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .subtitle[data-emotion="happy"] {
        border-color: #ffd166;
      }

      .subtitle[data-emotion="angry"] {
        border-color: #ff6b6b;
      }

      .subtitle[data-emotion="sad"] {
        border-color: #78b7ff;
      }

      .subtitle[data-emotion="surprised"] {
        border-color: #88e0d0;
      }
    </style>
  </head>
  <body>
    <div id="subtitle" class="subtitle" role="status" aria-live="polite" hidden></div>
    <script>
      const MAX_SEGMENT_LENGTH = 46;
      const MIN_SEGMENT_DISPLAY_MS = 1800;
      const MAX_SEGMENT_DISPLAY_MS = 4500;
      const DISPLAY_MS_PER_CHARACTER = 120;
      const FINAL_HOLD_MS = 1200;
      const subtitle = document.getElementById('subtitle');
      // ローカルファイルとしてOBSへ読み込んでも、Python起動後に自動接続します。
      const events = new EventSource('http://127.0.0.1:8765/subtitle-events');
      let subtitleTimerId = null;
      let playbackToken = 0;

      events.onopen = () => {
        window.parent.postMessage(
          {type: 'ai-youtuber-overlay-status', overlay: 'subtitle', connected: true},
          '*',
        );
      };

      function characterCount(text) {
        return Array.from(text).length;
      }

      function splitLongUnit(text) {
        const segments = [];
        let remaining = text.trim();

        while (characterCount(remaining) > MAX_SEGMENT_LENGTH) {
          const characters = Array.from(remaining);
          const minimumBreak = Math.floor(MAX_SEGMENT_LENGTH * 0.55);
          let breakAt = MAX_SEGMENT_LENGTH;

          for (let index = minimumBreak; index < MAX_SEGMENT_LENGTH; index += 1) {
            if (/[、，,\s]/.test(characters[index])) {
              breakAt = index + 1;
            }
          }

          segments.push(characters.slice(0, breakAt).join('').trim());
          remaining = characters.slice(breakAt).join('').trim();
        }

        if (remaining) segments.push(remaining);
        return segments;
      }

      function splitSubtitleText(text) {
        const normalized = text
          .replace(/\r\n/g, '\n')
          .replace(/[ \t]+/g, ' ')
          .trim();
        if (!normalized) return [];

        const units = normalized.match(/[^。！？!?\n]+[。！？!?]?|\n/g) || [normalized];
        const segments = [];
        let buffer = '';

        const flushBuffer = () => {
          if (!buffer) return;
          segments.push(buffer);
          buffer = '';
        };

        for (const unit of units) {
          if (unit === '\n') {
            flushBuffer();
            continue;
          }

          for (const piece of splitLongUnit(unit)) {
            const combined = `${buffer}${piece}`;
            if (buffer && characterCount(combined) > MAX_SEGMENT_LENGTH) {
              flushBuffer();
            }
            buffer = `${buffer}${piece}`;
          }
        }

        flushBuffer();
        return segments;
      }

      function getDisplayDuration(text) {
        return Math.min(
          MAX_SEGMENT_DISPLAY_MS,
          Math.max(
            MIN_SEGMENT_DISPLAY_MS,
            characterCount(text) * DISPLAY_MS_PER_CHARACTER,
          ),
        );
      }

      function getSegmentDurations(segments, audioDurationMs) {
        if (!Number.isFinite(audioDurationMs) || audioDurationMs <= 0) {
          return segments.map(getDisplayDuration);
        }

        const characterCounts = segments.map((segment) =>
          Math.max(characterCount(segment), 1),
        );
        const totalCharacterCount = characterCounts.reduce(
          (total, count) => total + count,
          0,
        );
        return characterCounts.map(
          (count) => audioDurationMs * (count / totalCharacterCount),
        );
      }

      function stopSubtitlePlayback() {
        playbackToken += 1;
        if (subtitleTimerId !== null) {
          window.clearTimeout(subtitleTimerId);
          subtitleTimerId = null;
        }
      }

      function hideSubtitle() {
        subtitle.textContent = '';
        subtitle.hidden = true;
        delete subtitle.dataset.emotion;
      }

      function clearSubtitle() {
        stopSubtitlePlayback();
        hideSubtitle();
      }

      function playSubtitle(command) {
        stopSubtitlePlayback();
        const token = playbackToken;
        const segments = splitSubtitleText(command.text);
        if (segments.length === 0) {
          hideSubtitle();
          return;
        }
        const segmentDurations = getSegmentDurations(
          segments,
          command.duration_ms,
        );

        const showSegment = (index) => {
          if (token !== playbackToken) return;
          if (index >= segments.length) {
            subtitleTimerId = window.setTimeout(() => {
              if (token === playbackToken) hideSubtitle();
            }, FINAL_HOLD_MS);
            return;
          }

          const segment = segments[index];
          subtitle.textContent = segment;
          subtitle.dataset.emotion = command.emotion || 'neutral';
          subtitle.hidden = false;
          subtitleTimerId = window.setTimeout(
            () => showSegment(index + 1),
            segmentDurations[index],
          );
        };

        showSegment(0);
      }

      events.onmessage = (event) => {
        try {
          const command = JSON.parse(event.data);
          if (command.type === 'clear') {
            clearSubtitle();
            return;
          }
          if (command.type !== 'subtitle' || typeof command.text !== 'string') {
            throw new Error('未対応の字幕コマンドです。');
          }
          playSubtitle(command);
        } catch (error) {
          console.error('字幕コマンドを処理できませんでした:', error);
        }
      };

      events.onerror = () => {
        console.error('字幕サーバーとの接続が切れました。再接続を待機します。');
        window.parent.postMessage(
          {type: 'ai-youtuber-overlay-status', overlay: 'subtitle', connected: false},
          '*',
        );
      };
    </script>
  </body>
</html>
